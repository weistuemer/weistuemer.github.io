<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Diachrone Ausbreitung: mhd. û (Haus)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Design für die Legende */
        .legend { background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; border-radius: 50%; }
        
        /* Design für den Zeit-Slider */
        .slider-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 300px;
        }
        .slider-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        #yearSlider { width: 100%; cursor: pointer; }
        #yearDisplay { font-weight: bold; color: #e66101; font-size: 1.2em; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="slider-container">
    <h3>Entwicklung bis Jahr: <span id="yearDisplay">1650</span></h3>
    <input type="range" id="yearSlider" min="1200" max="1700" step="10" value="1650">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    var map = L.map('map').setView([50.5, 10.0], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    function getColor(variante) {
        if(variante === 'u') return '#e66101';    
        if(variante === 'u_au') return '#b2abd2'; 
        if(variante === 'au') return '#5e3c99';   
        return '#808080'; 
    }

    // LayerGroup speichert die aktuellen Punkte, damit wir sie beim Sliden leicht löschen können
    var markerLayer = L.layerGroup().addTo(map);
    var allData = []; // Hier speichern wir die CSV-Daten zwischen

    // CSV einlesen
    Papa.parse("Diphthongierung.csv", {
        download: true,
        header: true,
        delimiter: ";",
        skipEmptyLines: true,
        complete: function(results) {
            allData = results.data;
            
            // Initiale Grenzen für den Slider basierend auf den Daten setzen
            var years = allData.map(r => parseInt(r['Jahr eigene'])).filter(y => !isNaN(y));
            var minYear = Math.min(...years) || 1200;
            var maxYear = Math.max(...years) || 1700;
            
            var slider = document.getElementById('yearSlider');
            slider.min = minYear - 10; // Etwas Puffer
            slider.max = maxYear;
            slider.value = maxYear;
            
            updateMap(maxYear); // Karte beim ersten Laden mit allen Daten füllen
        }
    });

    // Funktion, die die Karte basierend auf dem ausgewählten Jahr aktualisiert
    function updateMap(maxYear) {
        markerLayer.clearLayers(); // Alte Punkte löschen
        document.getElementById('yearDisplay').innerText = maxYear; // Zahl im Menü updaten

        allData.forEach(function(row) {
            // Wir nutzen die bereinigte Spalte "Jahr eigene"
            var rowYear = parseInt(row['Jahr eigene']);
            
            if(row.Y && row.X && row.Haus && !isNaN(rowYear)) {
                // Nur plotten, wenn das Jahr kleiner/gleich dem Slider-Wert ist
                if (rowYear <= maxYear) {
                    var lat = parseFloat(row.Y.replace(',', '.'));
                    var lon = parseFloat(row.X.replace(',', '.'));
                    
                    if(!isNaN(lat) && !isNaN(lon)) {
                        var marker = L.circleMarker([lat, lon], {
                            radius: 6,
                            fillColor: getColor(row.Haus),
                            color: "#fff", weight: 1, opacity: 1, fillOpacity: 0.8
                        });

                        var popupText = "<b>Ort:</b> " + (row['Ort Grimm'] || 'Unbekannt') + "<br>" +
                                        "<b>Variante:</b> " + row.Haus + "<br>" +
                                        "<b>Jahr:</b> " + row['Jahr eigene'];
                        marker.bindPopup(popupText);
                        markerLayer.addLayer(marker); // Zum Layer hinzufügen
                    }
                }
            }
        });
    }

    // Event-Listener: Wenn der Slider bewegt wird, Karte sofort updaten
    document.getElementById('yearSlider').addEventListener('input', function(e) {
        updateMap(e.target.value);
    });

    // Legende
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info legend');
        var grades = ['u', 'u_au', 'au'];
        var labels = ['mhd. û [u]', 'Mischform [u_au]', 'nhd. au [au]'];
        div.innerHTML += '<h4>Legende (Haus)</h4>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML += '<i style="background:' + getColor(grades[i]) + '"></i> ' + labels[i] + '<br>';
        }
        return div;
    };
    legend.addTo(map);
</script>

</body>
</html>
