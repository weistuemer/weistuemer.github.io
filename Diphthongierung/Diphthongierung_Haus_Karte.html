<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Diphthongierung von mhd. û (Haus)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }
        .legend { background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; border-radius: 50%; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // 1. Karte initialisieren (Zentriert auf Deutschland/Mitteleuropa)
    var map = L.map('map').setView([50.5, 10.0], 6);

    // 2. Hintergrundkarte laden (Heller, unaufdringlicher Stil)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // Farbschema passend zu deinem Design
    function getColor(variante) {
        if(variante === 'u') return '#e66101';    // Orange
        if(variante === 'u_au') return '#b2abd2'; // Helles Lila
        if(variante === 'au') return '#5e3c99';   // Dunkles Lila
        return '#808080'; // Grau für Sonstige/Unbekannt
    }

    // 3. CSV-Datei live einlesen
    Papa.parse("Diphthongierung.csv", {
        download: true,
        header: true,
        delimiter: ";", // Deine CSV ist durch Semikolon getrennt
        skipEmptyLines: true,
        complete: function(results) {
            var data = results.data;
            
            data.forEach(function(row) {
                // Nur Zeilen mit gültigen X/Y Koordinaten und einem Eintrag für "Haus" verarbeiten
                if(row.Y && row.X && row.Haus) {
                    // Kommas in den Koordinaten durch Punkte ersetzen
                    var lat = parseFloat(row.Y.replace(',', '.'));
                    var lon = parseFloat(row.X.replace(',', '.'));
                    
                    if(!isNaN(lat) && !isNaN(lon)) {
                        // Marker erstellen
                        var marker = L.circleMarker([lat, lon], {
                            radius: 6,
                            fillColor: getColor(row.Haus),
                            color: "#fff",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(map);

                        // Popup Text
                        var popupText = "<b>Ort:</b> " + (row['Ort Grimm'] || 'Unbekannt') + "<br>" +
                                        "<b>Variante (Haus):</b> " + row.Haus + "<br>" +
                                        "<b>Jahr:</b> " + (row.Jahr || '-');
                        marker.bindPopup(popupText);
                    }
                }
            });
        }
    });

    // 4. Legende hinzufügen
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info legend');
        var grades = ['u', 'u_au', 'au'];
        var labels = ['mhd. û [u]', 'Mischform [u_au]', 'nhd. au [au]'];

        div.innerHTML += '<h4>Legende (Haus)</h4>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML +=
                '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                labels[i] + '<br>';
        }
        return div;
    };
    legend.addTo(map);
</script>

</body>
</html>
