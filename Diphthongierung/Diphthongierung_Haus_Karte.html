<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Diachrone Ausbreitung: mhd. û (Haus)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .info-box { background: white; padding: 10px 15px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); line-height: 1.5; color: #333; }
        .info-box h4 { margin: 0 0 8px 0; font-size: 14px; color: #111; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
        .info-box i { width: 18px; height: 18px; float: left; margin-right: 8px; border-radius: 50%; }
        
.slider-container {
            position: absolute; 
            top: 20px;      /* Verschiebt den Regler an den oberen Rand */
            right: 20px;    /* Verschiebt den Regler an den rechten Rand */
            z-index: 1000; 
            background: white; 
            padding: 15px 25px; 
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3); 
            text-align: center; 
            width: 320px;
        }
        .slider-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        #yearSlider { width: 100%; cursor: pointer; }
        #yearDisplay { font-weight: bold; color: #e66101; font-size: 1.2em; }
        .stat-number { font-weight: bold; color: #e66101; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="slider-container">
    <h3>Entwicklung bis Jahr: <span id="yearDisplay">Lädt...</span></h3>
    <input type="range" id="yearSlider" min="1000" max="2000" step="1" value="2000">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    var map = L.map('map').setView([50.5, 10.0], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd', maxZoom: 20
    }).addTo(map);

    function getColor(variante) {
        if(variante === 'u') return '#5e3c99';    
        if(variante === 'u_au') return '#b2abd2'; 
        if(variante === 'au') return '#e66101';   
        return '#808080'; 
    }

    var markerLayer = L.layerGroup().addTo(map);
    var allData = []; 
    var statsMapped = 0, statsMissing = 0;

    // Statistik-Box initialisieren
    var statsControl = L.control({position: 'topleft'});
    statsControl.onAdd = function () {
        this._div = L.DomUtil.create('div', 'info-box');
        this.update(0, 0);
        return this._div;
    };
    statsControl.update = function (mapped, missing) {
        var total = mapped + missing;
     this._div.innerHTML = '<h4>Datensatz: <em>Haus</em></h4>' +
                      'Belege gesamt: <b>' + total + '</b><br>' +
                      'Kartiert: <span class="stat-number">' + mapped + '</span><br>' +
                      'Ohne Koordinaten: <b>' + missing + '</b>';
    };
    statsControl.addTo(map);

    // CSV laden und dynamische Slider-Werte berechnen
    Papa.parse("Diphthongierung.csv", {
        download: true,
        header: true,
        delimiter: ";",
        skipEmptyLines: true,
        complete: function(results) {
            allData = results.data;
            var validYears = [];

            allData.forEach(function(row) {
                if(row.Haus) {
                    // Jahr sicher in eine Zahl umwandeln
                    var y = parseInt(row['Jahr eigene'], 10);
                    
                    if(row.Y && row.X) {
                        var lat = parseFloat(row.Y.replace(',', '.'));
                        var lon = parseFloat(row.X.replace(',', '.'));
                        if(!isNaN(lat) && !isNaN(lon)) {
                            statsMapped++;
                            // Jahr nur speichern, wenn es kartierbar ist
                            if(!isNaN(y)) validYears.push(y);
                        } else {
                            statsMissing++;
                        }
                    } else {
                        statsMissing++;
                    }
                }
            });
            
            statsControl.update(statsMapped, statsMissing);

            // 1. Wahre Slider-Grenzen aus den Daten berechnen
            var minYear = Math.min.apply(null, validYears);
            var maxYear = Math.max.apply(null, validYears);

            // 2. HTML-Slider mit den echten Werten füttern
            var slider = document.getElementById('yearSlider');
            slider.min = minYear;
            slider.max = maxYear;
            slider.value = maxYear; // Startet ganz rechts (alle Daten)

            // 3. Karte mit dem Maximaljahr zeichnen
            updateMap(maxYear);
        }
    });

    // Funktion zum Zeichnen der Karte
    function updateMap(currentYearStr) {
        var yearLimit = parseInt(currentYearStr, 10);
        markerLayer.clearLayers(); 
        document.getElementById('yearDisplay').innerText = yearLimit; 

        allData.forEach(function(row) {
            if(row.Haus) {
                var rowYear = parseInt(row['Jahr eigene'], 10);
                
                // Prüfen ob Jahr der Zeile <= dem Slider-Wert ist
                if(!isNaN(rowYear) && rowYear <= yearLimit) {
                    if(row.Y && row.X) {
                        var lat = parseFloat(row.Y.replace(',', '.'));
                        var lon = parseFloat(row.X.replace(',', '.'));
                        
                        if(!isNaN(lat) && !isNaN(lon)) {
                            var marker = L.circleMarker([lat, lon], {
                                radius: 6, fillColor: getColor(row.Haus), 
                                color: "#fff", weight: 1, opacity: 1, fillOpacity: 0.8
                            });
                            var popupText = "<b>Ort:</b> " + (row['Ort Grimm'] || 'Unbekannt') + 
                                            "<br><b>Variante:</b> " + row.Haus + 
                                            "<br><b>Jahr:</b> " + rowYear;
                            marker.bindPopup(popupText);
                            markerLayer.addLayer(marker);
                        }
                    }
                }
            }
        });
    }

    // Wenn der Regler geschoben wird, Karte aktualisieren
    document.getElementById('yearSlider').addEventListener('input', function(e) {
        updateMap(e.target.value);
    });

    // Legende
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
        var div = L.DomUtil.create('div', 'info-box');
        div.innerHTML += '<h4>Legende</h4>' +
                         '<i style="background:#5e3c99"></i> mhd. û [u]<br>' +
                         '<i style="background:#b2abd2"></i> Mischform [u_au]<br>' +
                         '<i style="background:#e66101"></i> nhd. au [au]<br>';
        return div;
    };
    legend.addTo(map);
</script>

</body>
</html>
