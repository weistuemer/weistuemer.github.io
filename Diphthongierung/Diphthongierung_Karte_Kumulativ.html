<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Diachrone Ausbreitung: mhd. î (Wein) - Kumulativ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Design für die Legenden und Infoboxen */
        .info-box { 
            background: white; 
            padding: 10px 15px; 
            border-radius: 5px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            line-height: 1.5;
            color: #333;
        }
        .info-box h4 { margin: 0 0 8px 0; font-size: 14px; color: #111; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
        .info-box i { width: 18px; height: 18px; float: left; margin-right: 8px; border-radius: 50%; }
        
        /* Design für den Zeit-Slider */
        .slider-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 300px;
        }
        .slider-container h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        #yearSlider { width: 100%; cursor: pointer; }
        #yearDisplay { font-weight: bold; color: #5e3c99; font-size: 1.2em; } /* Lila für Wein */
        
        /* Hervorhebung der Zahlen in der Statistik */
        .stat-number { font-weight: bold; color: #5e3c99; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="slider-container">
    <h3>Entwicklung bis Jahr: <span id="yearDisplay">1650</span></h3>
    <input type="range" id="yearSlider" min="1200" max="1700" step="10" value="1650">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    var map = L.map('map').setView([50.5, 10.0], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // Farbschema passend zu "Wein"
    function getColor(variante) {
        if(variante === 'i') return '#5e3c99';    // Dunkles Lila
        if(variante === 'i_ei') return '#b2abd2'; // Helles Lila
        if(variante === 'ei') return '#e66101';   // Orange
        return '#808080'; // Grau
    }

    var markerLayer = L.layerGroup().addTo(map);
    var allData = []; 
    
    // Variablen für unsere Statistik
    var statsMapped = 0;
    var statsMissing = 0;

    // 1. Statistik-Box (oben links) initialisieren
    var statsControl = L.control({position: 'topleft'});
    statsControl.onAdd = function (map) {
        this._div = L.DomUtil.create('div', 'info-box');
        this.update(0, 0); // Startwerte
        return this._div;
    };
    statsControl.update = function (mapped, missing) {
        var total = mapped + missing;
        this._div.innerHTML = '<h4>Datensatz: <i>Wein</i></h4>' +
                              'Belege gesamt: <b>' + total + '</b><br>' +
                              'Kartiert: <span class="stat-number">' + mapped + '</span><br>' +
                              'Ohne Koordinaten: <b>' + missing + '</b>';
    };
    statsControl.addTo(map);

    // 2. CSV einlesen und zählen
    Papa.parse("Diphthongierung.csv", {
        download: true,
        header: true,
        delimiter: ";",
        skipEmptyLines: true,
        complete: function(results) {
            allData = results.data;
            
            // Statistik berechnen
            allData.forEach(function(row) {
                if(row.Wein) { // Nur Zeilen zählen, die einen Eintrag für "Wein" haben
                    if(row.Y && row.X) {
                        var lat = parseFloat(row.Y.replace(',', '.'));
                        var lon = parseFloat(row.X.replace(',', '.'));
                        if(!isNaN(lat) && !isNaN(lon)) {
                            statsMapped++;
                        } else {
                            statsMissing++;
                        }
                    } else {
                        statsMissing++;
                    }
                }
            });
            
            // Box updaten
            statsControl.update(statsMapped, statsMissing);

            // Slider-Grenzen setzen
            var years = allData.map(r => parseInt(r['Jahr eigene'])).filter(y => !isNaN(y));
            var minYear = Math.min(...years) || 1200;
            var maxYear = Math.max(...years) || 1700;
            
            var slider = document.getElementById('yearSlider');
            slider.min = minYear - 10;
            slider.max = maxYear;
            slider.value = maxYear;
            
            updateMap(maxYear);
        }
    });

    // 3. Karte updaten (Slider)
    function updateMap(maxYear) {
        markerLayer.clearLayers(); 
        document.getElementById('yearDisplay').innerText = maxYear; 

        allData.forEach(function(row) {
            var rowYear = parseInt(row['Jahr eigene']);
            
            // Auf 'row.Wein' prüfen!
            if(row.Y && row.X && row.Wein && !isNaN(rowYear)) {
                if (rowYear <= maxYear) {
                    var lat = parseFloat(row.Y.replace(',', '.'));
                    var lon = parseFloat(row.X.replace(',', '.'));
                    
                    if(!isNaN(lat) && !isNaN(lon)) {
                        var marker = L.circleMarker([lat, lon], {
                            radius: 6,
                            fillColor: getColor(row.Wein),
                            color: "#fff", weight: 1, opacity: 1, fillOpacity: 0.8
                        });

                        var popupText = "<b>Ort:</b> " + (row['Ort Grimm'] || 'Unbekannt') + "<br>" +
                                        "<b>Variante (Wein):</b> " + row.Wein + "<br>" +
                                        "<b>Jahr:</b> " + row['Jahr eigene'];
                        marker.bindPopup(popupText);
                        markerLayer.addLayer(marker);
                    }
                }
            }
        });
    }

    document.getElementById('yearSlider').addEventListener('input', function(e) {
        updateMap(e.target.value);
    });

    // 4. Farblegende (unten rechts)
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info-box');
        var grades = ['i', 'i_ei', 'ei'];
        var labels = ['mhd. î [i]', 'Mischform [i_ei]', 'nhd. ei [ei]'];
        div.innerHTML += '<h4>Legende (Wein)</h4>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML += '<i style="background:' + getColor(grades[i]) + '"></i> ' + labels[i] + '<br>';
        }
        return div;
    };
    legend.addTo(map);
</script>

</body>
</html>
