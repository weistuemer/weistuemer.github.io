<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Diphthongierung von mhd. î (Wein)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100%; }
        .legend { 
            background: white; 
            padding: 10px 15px; 
            border-radius: 5px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            line-height: 1.6;
        }
        .legend h4 { margin: 0 0 8px 0; font-size: 14px; color: #333; }
        .legend i { width: 16px; height: 16px; float: left; margin-right: 8px; border-radius: 50%; opacity: 0.8; border: 1px solid #fff; }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // 1. Karte initialisieren (Zentriert auf Deutschland/Mitteleuropa)
    var map = L.map('map').setView([50.5, 10.0], 6);

    // 2. Hintergrundkarte laden (Heller, unaufdringlicher Stil)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // Farbschema passend zu deinem Design für "Wein"
    function getColor(variante) {
        if(variante === 'i') return '#5e3c99';    // Dunkles Lila
        if(variante === 'i_ei') return '#b2abd2'; // Helles Lila
        if(variante === 'ei') return '#e66101';   // Orange
        return '#808080'; // Grau für Sonstige/Unbekannt
    }

    // 3. CSV-Datei live einlesen
    Papa.parse("Diphthongierung.csv", {
        download: true,
        header: true,
        delimiter: ";", // Deine CSV ist durch Semikolon getrennt
        skipEmptyLines: true,
        complete: function(results) {
            var data = results.data;
            
            data.forEach(function(row) {
                // Nur Zeilen mit gültigen X/Y Koordinaten und einem Eintrag für "Wein" verarbeiten
                if(row.Y && row.X && row.Wein) {
                    // Kommas in den Koordinaten durch Punkte ersetzen
                    var lat = parseFloat(row.Y.replace(',', '.'));
                    var lon = parseFloat(row.X.replace(',', '.'));
                    
                    if(!isNaN(lat) && !isNaN(lon)) {
                        // Marker erstellen
                        var marker = L.circleMarker([lat, lon], {
                            radius: 6,
                            fillColor: getColor(row.Wein),
                            color: "#fff",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(map);

                        // Popup Text zusammensetzen
                        var popupText = "<b>Ort:</b> " + (row['Ort Grimm'] || 'Unbekannt') + "<br>" +
                                        "<b>Variante (Wein):</b> " + row.Wein + "<br>" +
                                        "<b>Jahr:</b> " + (row.Jahr || '-') + "<br>" +
                                        "<b>Region:</b> " + (row['Region eigene'] || '-');
                        marker.bindPopup(popupText);
                    }
                }
            });
        }
    });

    // 4. Legende hinzufügen
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info legend');
        var grades = ['i', 'i_ei', 'ei'];
        var labels = ['mhd. î [i]', 'Mischform [i_ei]', 'nhd. ei [ei]'];

        div.innerHTML += '<h4>Legende (Wein)</h4>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML +=
                '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                labels[i] + '<br>';
        }
        return div;
    };
    legend.addTo(map);
</script>

</body>
</html>
